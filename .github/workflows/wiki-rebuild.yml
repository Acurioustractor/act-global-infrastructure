name: Wiki Rebuild

on:
  push:
    branches: [main]
    paths:
      - 'wiki/concepts/**'
      - 'wiki/projects/**'
      - 'wiki/communities/**'
      - 'wiki/people/**'
      - 'wiki/stories/**'
      - 'wiki/art/**'
      - 'wiki/finance/**'
      - 'wiki/technical/**'
      - 'wiki/decisions/**'
      - 'wiki/research/**'
      - 'wiki/synthesis/**'
      - 'wiki/index.md'
      - 'wiki/AGENTS.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    name: Rebuild Tractorpedia Viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts 2>/dev/null || true

      - name: Lint wiki
        run: node scripts/wiki-lint.mjs || true

      - name: Update search index
        if: ${{ env.HAS_OPENAI == 'true' }}
        run: node scripts/wiki-index-search.mjs --full || true
        env:
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Rebuild viewer + snapshot
        run: node scripts/wiki-build-viewer.mjs

      - name: Copy viewer to public
        run: cp tools/act-wikipedia.html apps/command-center/public/tractorpedia.html

      # main is branch-protected, so the rebuilt files land through one standing PR on a
      # fixed branch, updated in place, and merged by a human like any other PR. A PR opened
      # with GITHUB_TOKEN does not trigger the required checks, so this needs a PAT
      # (CROSS_REPO_TOKEN). No [skip ci]: the required checks must run on it.
      - name: Open or update the rebuild PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          branch: auto/wiki-rebuild
          base: main
          delete-branch: true
          add-paths: |
            tools/act-wikipedia.html
            apps/command-center/public/tractorpedia.html
            apps/command-center/public/wiki/
          commit-message: "chore: auto-rebuild Tractorpedia viewer"
          title: "chore: auto-rebuild Tractorpedia viewer"
          body: "Generated by the wiki-rebuild workflow from the wiki on main: the rebuilt viewer and the command-center snapshot. Merge to publish."
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Dispatch to act-regenerative-studio
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: Acurioustractor/act-regenerative-studio
          event-type: wiki-content-updated
        env:
          HAS_TOKEN: ${{ secrets.CROSS_REPO_TOKEN != '' }}
